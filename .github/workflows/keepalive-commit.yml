# GitHub switches off scheduled jobs in public repos after 60 days without a commit.
# On the 1st of every month this writes today's date to .github/last-keepalive and
# commits it, so "Keep Supabase awake" is never switched off. No website file is touched.
name: Monthly keep-alive commit
on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record the date and commit it
        run: |
          date -u +%Y-%m-%d > .github/last-keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-keepalive
          git diff --cached --quiet && { echo "Already done today."; exit 0; }
          git commit -m "Monthly keep-alive (keeps scheduled jobs switched on)"
          git push
